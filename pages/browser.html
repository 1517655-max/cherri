<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cherri / Browser</title>
  <link rel="icon" href="/assets/img/fav.png">
  <link rel="stylesheet" href="/assets/css/proxy.css">
  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/homework/math.all.js"></script>
  <script src="/assets/js/browserfunctions.js"></script>
  <script src="/assets/js/proxy-browser.js" defer></script>
</head>
<body class="browser-shell">
  <header class="browser-container">
    <div class="browser-top"><a class="wordmark" href="/start.html" aria-label="Cherri home"><img src="/assets/img/fav.png" alt="">cherri</a><div class="tabs"><button class="newtab" onclick="newTab()" aria-label="New tab">+</button></div></div>
    <form class="toolbar" id="browser-form"><button type="button" onclick="b()" aria-label="Back">←</button><button type="button" onclick="f()" aria-label="Forward">→</button><button type="button" onclick="r()" aria-label="Reload">↻</button><label class="sr-only" for="searchbar">Website or search query</label><input id="searchbar" placeholder="Search or enter a website" autocomplete="off" required><button type="submit" aria-label="Go">↗</button><button type="button" id="retry-connection" aria-label="Reconnect relay" title="Reconnect relay">⟳</button><button class="fullscreen" type="button" onclick="full()" aria-label="Fullscreen">⛶</button></form>
    <div class="browser-status"><span id="connection-status" role="status">Preparing browser…</span><a href="/start.html">Public relay · Connection info</a></div>
  </header>
  <div id="browser-message" class="browser-message" role="alert"></div>
</body>
</html>
